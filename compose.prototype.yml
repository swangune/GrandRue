services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mainstreet
      POSTGRES_USER: mainstreet
      POSTGRES_PASSWORD: mainstreet
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainstreet -d mainstreet"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mainstreet-prototype-postgres-v18:/var/lib/postgresql

volumes:
  mainstreet-prototype-postgres-v18:
