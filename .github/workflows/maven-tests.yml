name: Maven Tests

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: grandrue_test
          POSTGRES_USER: grandrue
          POSTGRES_PASSWORD: grandrue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grandrue -d grandrue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GRANDRUE_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/grandrue_test
      GRANDRUE_TEST_POSTGRES_USER: grandrue
      GRANDRUE_TEST_POSTGRES_PASSWORD: grandrue

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run unit and PostgreSQL integration tests
        run: mvn --batch-mode clean verify -Ppostgres-it
