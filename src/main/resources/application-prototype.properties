# Local-only executable prototype profile. Override with environment variables
# rather than changing source when PostgreSQL is elsewhere.
spring.datasource.url=${MAINSTREET_PROTOTYPE_POSTGRES_URL:jdbc:postgresql://localhost:55432/mainstreet}
spring.datasource.username=${MAINSTREET_PROTOTYPE_POSTGRES_USER:mainstreet}
spring.datasource.password=${MAINSTREET_PROTOTYPE_POSTGRES_PASSWORD:mainstreet}
spring.flyway.enabled=true
